services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tabletennis
      POSTGRES_PASSWORD: tabletennis
      POSTGRES_DB: tabletennis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletennis -d tabletennis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
